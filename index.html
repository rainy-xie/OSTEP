<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <meta name="description" content="用一张交互知识地图复习 OSTEP，沿着虚拟化、并发和持久性找到教材章节、仓库示例和自测练习。">
  <title>OSTEP · 操作系统学习地图</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="study/atlas.css">
  <script defer src="study/core.js"></script>
  <script defer src="study/virtualization.js"></script>
  <script defer src="study/concurrency.js"></script>
  <script defer src="study/persistence.js"></script>
  <script defer src="study/chapters.js"></script>
  <script defer src="study/chip.js"></script>
  <script defer src="study/atlas.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到学习内容</a>
  <header class="topbar">
    <div class="top-inner wrap">
      <a class="brand" href="#map" aria-label="OSTEP 学习手册首页">
        <span class="brand-symbol" data-icon="layers"></span><strong>OSTEP</strong><span class="brand-divider"></span><span class="brand-sub">学习手册</span>
      </a>
      <nav aria-label="主导航">
        <a id="nav-map" href="#map">学习地图</a>
        <a id="nav-library" href="#library">资料索引</a>
      </nav>
      <a class="book-link" href="操作系统导论-OSTEP.pdf" target="_blank" rel="noopener"><span data-icon="book"></span><span>打开教材</span><small>PDF</small></a>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1">
    <div class="hero">
      <div>
        <div class="eyebrow"><i></i> OPERATING SYSTEMS: THREE EASY PIECES</div>
        <h1 id="page-title">操作系统学习地图</h1>
        <p id="page-intro">从三个基本问题出发，串起教材、代码与练习。</p>
      </div>
      <div id="progress" class="progress-block"></div>
    </div>

    <section id="map-view" aria-label="学习地图">
      <div class="workspace">
        <div class="map-card panel">
          <div class="panel-head">
            <h2><span data-icon="network"></span>知识结构</h2>
            <button type="button" class="overview-toggle" id="overview-toggle" aria-expanded="false" aria-controls="branches"><span data-icon="network"></span><span>展开全图</span></button>
          </div>
          <div class="map-stage">
            <div class="cross tl"></div><div class="cross tr"></div><div class="cross bl"></div><div class="cross br"></div>
            <div class="root-node"><canvas id="chip" width="510" height="262" aria-hidden="true"></canvas><strong>操作系统</strong></div>
            <div class="branches" id="branches" role="group" aria-label="选择学习主线"></div>
          </div>
          <div class="resume" id="resume"></div>
        </div>
        <section class="topics panel" id="topics" aria-label="主线知识点" tabindex="-1"></section>
      </div>

      <section class="entry-section" aria-labelledby="entry-title">
        <div class="section-title"><h2 id="entry-title">仓库入口</h2><span class="section-rule"></span><span class="section-sub">REPOSITORY</span></div>
        <div class="entries" id="entries"></div>
      </section>
    </section>

    <section id="library-view" aria-label="资料索引" hidden>
      <div class="library-panel panel">
        <div class="library-tools">
          <div id="filters" class="filters" role="group" aria-label="按资料类型筛选"></div>
          <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="搜索资料、知识点或路径" aria-label="搜索资料、知识点或路径"></label>
        </div>
        <div id="match-count" class="match-count" aria-live="polite"></div>
        <div id="results"></div>
      </div>
    </section>
    <noscript>启用 JavaScript 后即可切换主线、查看自测题和记录进度。你也可以直接打开上方的教材。</noscript>
  </main>
  <dialog id="lesson-dialog" aria-labelledby="lesson-title"><div id="lesson"></div></dialog>
</body>
</html>
